name: Deploy Arkade App

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Build configured deployment
        run: |
          test -n "$VITE_API_URL" || (echo "Set the VITE_API_URL repository variable" && exit 1)
          test -n "$VITE_NETWORK" || (echo "Set the VITE_NETWORK repository variable" && exit 1)
          test -n "$VITE_APP_URL" || (echo "Set the VITE_APP_URL repository variable" && exit 1)
          npm run build
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL }}
          VITE_NETWORK: ${{ vars.VITE_NETWORK }}
          VITE_APP_URL: ${{ vars.VITE_APP_URL }}
      - run: npm run lint
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
